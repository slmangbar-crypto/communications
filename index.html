<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة بلاغات المنشآت الوطنية | النظام الرقمي لمتابعة البلاغات</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 Pro/Free Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Font: Tajawal & Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Tajawal', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
            },
            accent: {
              500: '#d97706',
              600: '#b45309',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
  </style>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

  <!-- Header / Navigation Bar -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-lg border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        
        <!-- Logo & Branding -->
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-slate-900 shadow-md">
            <i class="fa-solid fa-building-shield text-2xl"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-xl font-black tracking-wide text-white">منصة بلاغات المنشآت</h1>
              <span class="bg-amber-500/20 text-amber-400 text-xs px-2 py-0.5 rounded-full border border-amber-500/30 font-bold">المملكة العربية السعودية</span>
            </div>
            <p class="text-xs text-slate-400 mt-0.5">النظام الوطني الموحد لرصد ومتابعة مخالفات المنشآت التجارية</p>
          </div>
        </div>

        <!-- Right Side Actions -->
        <div class="flex items-center gap-3">
          <!-- Dark Mode Toggle -->
          <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition">
            <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
          </button>

          <!-- New Report Trigger -->
          <button onclick="openWizardModal()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold px-5 py-2.5 rounded-xl shadow-lg hover:shadow-amber-500/20 transition flex items-center gap-2">
            <i class="fa-solid fa-circle-plus text-lg"></i>
            <span>تقديم بلاغ جديد</span>
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">

    <!-- Hero / Metrics Dashboard -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
      
      <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700/60 relative overflow-hidden">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">إجمالي البلاغات المسجلة</p>
            <h3 id="statTotal" class="text-3xl font-black text-slate-900 dark:text-white mt-2">0</h3>
          </div>
          <div class="w-14 h-14 rounded-2xl bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center text-2xl">
            <i class="fa-solid fa-folder-open"></i>
          </div>
        </div>
        <div class="mt-4 flex items-center text-xs text-emerald-600 dark:text-emerald-400 font-semibold gap-1">
          <i class="fa-solid fa-arrow-trend-up"></i>
          <span>تحديث فوري للقاعدة</span>
        </div>
      </div>

      <div
